<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dae-ui</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --line:#2b3648; --fg:#e6edf3; --dim:#8b98a9; --acc:#3b82f6; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:18px 14px 60px; }
  h1 { font-size:20px; margin:4px 0 2px; } h2 { font-size:16px; margin:0 0 10px; }
  .dim { color:var(--dim); } .ok { color:var(--ok); } .bad { color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:14px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; }
  input[type=text], select { background:#0d1319; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; min-width:0; }
  input[type=text] { flex:1; }
  button { background:#24314a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 14px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  label.chk { display:inline-flex; gap:4px; align-items:center; margin-right:10px; }
  .subitem, .gcard { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; background:#141b26; }
  .gcard .grid { display:grid; grid-template-columns:110px 1fr; gap:7px 10px; align-items:center; margin-top:8px; }
  .gcard .grid label { color:var(--dim); }
  pre { background:#0d1319; border:1px solid var(--line); border-radius:8px; padding:10px; max-height:300px; overflow:auto; white-space:pre-wrap; word-break:break-all; font-size:12px; }
  #msg { min-height:22px; margin-top:8px; white-space:pre-wrap; }
  .tag { font-size:12px; background:#24314a; border-radius:4px; padding:1px 7px; }
  select.nodesel { width:100%; }
  .chip { padding:4px 11px; margin:2px 3px 2px 0; border-radius:20px; font-size:13px; }
  .chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .geopick { max-height:132px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-top:6px; background:#0d1319; }
  .geopick label { display:inline-flex; gap:4px; align-items:center; margin:3px 12px 3px 0; font-size:13px; cursor:pointer; }
  .geobucket { border-bottom:1px dashed var(--line); padding:2px 0; }
  .geobucket:last-child { border-bottom:none; }
  .geobucket summary { cursor:pointer; padding:4px 0; font-size:14px; }
  .geobucket > div { padding:2px 0 7px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>dae-ui <span class="dim" style="font-size:13px">订阅 · 策略组 · 节点切换</span> <span class="dim" id="panelVer" style="font-size:12px"></span></h1>

  <div class="card">
    <div class="row">
      <div class="grow">
        dae 状态：<span id="daeStatus">…</span>
        <span class="dim" id="daeVersion"></span>
      </div>
      <button onclick="svc('start')">启动</button>
      <button onclick="svc('stop')">停止</button>
      <button onclick="svc('restart')">重启</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="dim">LAN 网卡（旁路接管局域网时填，如 eth0；只代理本机留空）</label>
      <input type="text" id="lanIface" placeholder="留空" style="max-width:180px">
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="applyAll()">保存并应用配置</button>
      <button onclick="refreshSubs()">刷新全部订阅</button>
      <span class="dim">应用 = 生成配置 → dae 校验 → 热重载（不断连接）</span>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>节点切换</h2>
    <div class="dim" style="margin-bottom:6px">每个策略组一行：选“自动”按延迟选优，选具体节点即固定走它。选择后自动保存并热重载生效，不用再点应用。</div>
    <div id="switchList"></div>
  </div>

  <div class="card">
    <h2>订阅</h2>
    <div id="subList"></div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="newSubTag" placeholder="标签（英文，如 airport1）" style="max-width:200px;flex:none">
      <input type="text" id="newSubUrl" placeholder="订阅链接 https://…">
      <button onclick="addSub()">添加并拉取</button>
    </div>
  </div>

  <div class="card">
    <div class="row"><h2 class="grow" style="margin:0">策略组</h2><button onclick="addGroup()">+ 新建策略组</button></div>
    <div class="dim" style="margin-top:6px">自动模式：按关键词筛选节点 + 延迟最优。手动模式：固定使用选中的节点（切换即时热重载）。自定义组可绑域名关键词 / geosite 分类 / 域名列表 / 目标端口，命中的流量走该组；组卡右上角有加密货币、Emby 一键预设。默认组是全局兜底出口。</div>
    <div id="groupList"></div>
  </div>

  <div class="card">
    <div class="row"><h2 class="grow" style="margin:0">dae 日志</h2><button onclick="loadLogs()">刷新日志</button></div>
    <pre id="logs">（点击刷新）</pre>
  </div>
</div>

<script>
let S = { subs: [], groups: [], settings: { lan_interface: "" }, nodes: {}, dae: {} };

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function msg(t, bad){ const m = document.getElementById("msg"); m.textContent = t||""; m.className = bad ? "bad" : "ok"; }
async function api(path, body){
  const r = await fetch(path, body ? { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) } : {});
  return r.json();
}
function csv(v){ return (v||[]).join(", "); }
function parseCsv(v){ return String(v||"").split(/[,，]/).map(x=>x.trim()).filter(Boolean); }

function render(){
  document.getElementById("daeStatus").innerHTML = S.dae.active ? '<span class="ok">● 运行中</span>' : '<span class="bad">● 未运行</span>';
  document.getElementById("daeVersion").textContent = S.dae.version || "";
  document.getElementById("lanIface").value = S.settings.lan_interface || "";

  const sl = document.getElementById("subList");
  sl.innerHTML = S.subs.map((s,i)=>{
    const c = S.nodes[s.tag] || {};
    const cnt = c.nodes ? c.nodes.length : 0;
    const when = c.fetched_at ? new Date(c.fetched_at*1000).toLocaleString() : "未拉取";
    return `<div class="subitem"><div class="row">
      <span class="tag">${esc(s.tag)}</span>
      <span class="grow" style="word-break:break-all">${esc(s.url)}</span>
      <span class="dim">${cnt} 节点 · ${when}</span>
      ${c.error ? `<span class="bad">${esc(c.error)}</span>` : ""}
      <button onclick="fetchOne(${i})">拉取</button>
      <button class="danger" onclick="delSub(${i})">删除</button>
    </div></div>`;
  }).join("") || '<div class="dim">暂无订阅</div>';

  const gl = document.getElementById("groupList");
  gl.innerHTML = S.groups.map((g,i)=> groupHtml(g,i)).join("");
  renderSwitch();
  S.groups.forEach((g, gi)=> renderGeoPick(gi, ""));
  const pv = document.getElementById("panelVer");
  if (pv && S.panel_version) pv.textContent = "v" + S.panel_version;
}

function renderSwitch(){
  const el = document.getElementById("switchList");
  if (!el) return;
  const hasNodes = S.subs.some(s => ((S.nodes[s.tag]||{}).nodes||[]).length);
  el.innerHTML = S.groups.map((g,i)=>{
    let opts = `<option value=""${g.mode==="auto"?" selected":""}>自动（延迟最优）</option>`;
    let found = g.mode !== "manual";
    for (const s of S.subs){
      const c = S.nodes[s.tag];
      if (!c || !c.nodes || !c.nodes.length) continue;
      opts += `<optgroup label="${esc(s.tag)}">` + c.nodes.map((n,j)=>{
        const sel = g.mode==="manual" && g.node && g.node.sub===s.tag && g.node.name===n.name;
        if (sel) found = true;
        return `<option value="${esc(s.tag)}|${j}"${sel?" selected":""}>${esc(n.name)} (${esc(n.proto)})</option>`;
      }).join("") + "</optgroup>";
    }
    if (g.mode==="manual" && g.node && !found)
      opts += `<option value="keep" selected>${esc(g.node.name)}（当前固定）</option>`;
    return `<div class="row" style="margin:7px 0">
      <span style="min-width:150px">${esc(g.name)} <span class="tag">${esc(g.id)}</span></span>
      <select class="nodesel" style="flex:1" onchange="switchNode(${i}, this.value)">${opts}</select>
      ${hasNodes ? "" : '<span class="dim">先拉取订阅</span>'}
    </div>`;
  }).join("");
}

async function switchNode(i, v){
  const g = S.groups[i];
  if (v === ""){ g.mode = "auto"; }
  else if (v === "keep"){ /* 保持当前固定节点 */ }
  else {
    const [tag, j] = v.split("|");
    const n = ((S.nodes[tag]||{}).nodes||[])[Number(j)];
    if (!n) return;
    g.mode = "manual";
    g.node = { sub: tag, name: n.name, link: n.link };
  }
  render();
  msg("切换节点中…");
  const sv = await save();
  if (!sv.ok){ msg(sv.message || "保存失败", true); return; }
  const r = await api("/api/apply");
  msg(r.ok ? "✓ 已切换：" + g.name + (g.mode==="manual" && g.node ? " → " + g.node.name : " → 自动") + "（已热重载）"
           : "✗ " + (r.message || "应用失败") + (r.output ? "\n" + r.output : ""), !r.ok);
  const st = await api("/api/state"); S.dae = st.dae; render();
}

function nodeOptions(g){
  let h = '<option value="">（选择节点）</option>';
  for (const s of S.subs){
    const c = S.nodes[s.tag];
    if (!c || !c.nodes || !c.nodes.length) continue;
    h += `<optgroup label="${esc(s.tag)}">` + c.nodes.map((n,j)=>{
      const sel = g.node && g.node.sub===s.tag && g.node.name===n.name ? " selected" : "";
      return `<option value="${esc(s.tag)}|${j}"${sel}>${esc(n.name)} (${esc(n.proto)})</option>`;
    }).join("") + "</optgroup>";
  }
  return h;
}

function groupHtml(g, i){
  const isProxy = g.id === "proxy";
  const subChecks = S.subs.map(s=>{
    const on = (g.subs||[]).includes(s.tag) ? " checked" : "";
    return `<label class="chk"><input type="checkbox" ${on} onchange="gSub(${i},'${esc(s.tag)}',this.checked)">${esc(s.tag)}</label>`;
  }).join("") || '<span class="dim">（全部订阅）</span>';
  return `<div class="gcard">
    <div class="row">
      <input type="text" value="${esc(g.name)}" style="max-width:220px;flex:none" onchange="gSet(${i},'name',this.value)">
      <span class="tag">${esc(g.id)}</span>
      <select onchange="gSet(${i},'mode',this.value)">
        <option value="auto"${g.mode==="auto"?" selected":""}>自动（延迟最优）</option>
        <option value="manual"${g.mode==="manual"?" selected":""}>手动（固定节点）</option>
      </select>
      <span class="grow"></span>
      ${isProxy ? '<span class="dim">兜底组，不可删除</span>' : `<button onclick="applyPreset(${i},'wallet')">＋预设·加密货币</button><button onclick="applyPreset(${i},'emby')">＋预设·Emby</button><button class="danger" onclick="delGroup(${i})">删除组</button>`}
    </div>
    <div class="grid">
      <label>订阅范围</label><div>${subChecks}<div class="dim">不勾 = 全部订阅</div></div>
      ${g.mode==="manual"
        ? `<label>固定节点</label><div><select class="nodesel" onchange="gNode(${i},this.value)">${nodeOptions(g)}</select></div>`
        : `<label>节点名包含</label><div>${regionChipsHtml(g, i)}<input type="text" value="${esc(customIncludeWords(g).join(", "))}" placeholder="自定义关键词（逗号分隔，可不填）" onchange="gIncludeCustom(${i},this.value)" style="margin-top:5px"></div>`}
      <label>节点名排除</label><div><input type="text" value="${esc(csv(g.exclude))}" onchange="gSet(${i},'exclude',parseCsv(this.value))"></div>
      ${isProxy ? "" : `<label>域名关键词</label><div><input type="text" value="${esc(csv(g.domains))}" placeholder="如 youtube, netflix（命中走本组）" onchange="gSet(${i},'domains',parseCsv(this.value))"></div>
      <label>geosite 分类</label><div><input type="text" placeholder="搜索分类，如 emby、crypto、youtube…" oninput="renderGeoPick(${i}, this.value)"><span class="dim" id="geoCount${i}" style="margin-left:8px"></span><div class="geopick" id="geoPick${i}"></div></div>
      <label>域名后缀</label><div><textarea rows="2" style="width:100%;background:#0d1319;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px" placeholder="没有 geosite 分类时用它：一行一个域名，后缀匹配，如 bitget.com、你的 Emby 服务器域名" onchange="gSet(${i},'suffixes',parseCsv(this.value.replace(/\\n/g,',')))">${esc((g.suffixes||[]).join("\n"))}</textarea></div>
      <label>目标端口</label><div><input type="text" value="${esc(csv(g.ports))}" placeholder="如 8096, 8920（Emby 常用；按端口命中走本组）" onchange="gSet(${i},'ports',parseCsv(this.value).map(Number).filter(n=>n>0&&n<=65535))"></div>`}
    </div>
  </div>`;
}

const PRESETS = {
  wallet: { geosites: ["category-cryptocurrency"], suffixes: ["bitget.com", "coinbase.com", "mexc.com"], ports: [] },
  emby: { geosites: ["category-emby"], suffixes: [], ports: [8096, 8920] },
};
function applyPreset(i, key){
  const p = PRESETS[key], g = S.groups[i];
  g.geosites = [...new Set([...(g.geosites||[]), ...p.geosites])];
  g.suffixes = [...new Set([...(g.suffixes||[]), ...p.suffixes])];
  g.ports = [...new Set([...(g.ports||[]), ...p.ports])];
  render();
}

function gSet(i, k, v){ S.groups[i][k] = v; if (k==="mode") render(); }

/* ---------- 节点名关键词：地区点选 ---------- */
const REGION_PRESETS = [
  ["香港","HK"],["台湾","TW"],["日本","JP"],["新加坡","SG"],["美国","US"],["韩国","KR"],
  ["英国","UK"],["德国","DE"],["法国","FR"],["澳大利亚","AU"],["加拿大","CA"],["印度","IN"],
  ["荷兰","NL"],["土耳其","TR"],["俄罗斯","RU"],["巴西","BR"],["阿根廷","AR"],["泰国","TH"],["越南","VN"],["马来西亚","MY"],
];
const PRESET_WORDS = new Set(REGION_PRESETS.flat());
function regionOn(g, vars){ return vars.some(w => (g.include||[]).includes(w)); }
function regionChipsHtml(g, i){
  return REGION_PRESETS.map(vars =>
    `<button type="button" class="chip${regionOn(g, vars) ? " on" : ""}" onclick="toggleRegion(${i},'${vars[0]}')">${esc(vars[0])}</button>`
  ).join("");
}
function toggleRegion(i, label){
  const vars = REGION_PRESETS.find(v => v[0] === label) || [label];
  let inc = [...(S.groups[i].include || [])];
  if (regionOn(S.groups[i], vars)) inc = inc.filter(w => !vars.includes(w));
  else for (const w of vars) if (!inc.includes(w)) inc.push(w);
  S.groups[i].include = inc;
  render();
}
function customIncludeWords(g){ return (g.include || []).filter(w => !PRESET_WORDS.has(w)); }
function gIncludeCustom(i, v){
  const keep = (S.groups[i].include || []).filter(w => PRESET_WORDS.has(w));
  S.groups[i].include = [...keep, ...parseCsv(v)];
}

/* ---------- geosite 分类：搜索 + 勾选 ---------- */
let GEO_CATS = [];
const GEO_FALLBACK = ["category-cryptocurrency","category-emby","category-media","category-games","category-ads","youtube","netflix","disney","hbo","hulu","twitch","spotify","bahamut","steam","telegram","openai","github","google","apple","twitter","facebook","tiktok","discord","reddit","amazon","cloudflare"];
function geoToggle(i, cat, on){
  let arr = [...(S.groups[i].geosites || [])];
  if (on && !arr.includes(cat)) arr.push(cat);
  if (!on) arr = arr.filter(c => c !== cat);
  S.groups[i].geosites = arr;
  const el = document.getElementById("geoCount" + i);
  if (el) el.textContent = arr.length ? `已选 ${arr.length} 个` : "";
}
const GEO_BUCKETS = [
  { name: "📺 流媒体", cats: ["youtube","netflix","disney","hbo","hulu","twitch","primevideo","abema","dazn","niconico","spotify","soundcloud","tidal","kkbox","vimeo","bahamut","category-emby","category-media"] },
  { name: "🤖 AI", cats: ["openai","google-gemini","perplexity","huggingface","github-copilot","deepseek","doubao","category-ai-cn"] },
  { name: "💰 加密货币", cats: ["category-cryptocurrency","binance","bybit","okx","gateio","huobi","kraken","kucoin"] },
  { name: "🇨🇳 国内网站", cats: ["geolocation-cn","category-media-cn","bilibili","iqiyi","youku","acfun","baidu","zhihu","xiaohongshu","douyin","alibaba","tencent","netease","meituan","xiaomi","huawei","oppo","vivo","category-bank-cn","category-education-cn"] },
  { name: "🍎 苹果", cats: ["apple","icloud","apple-music","apple-podcasts"] },
  { name: "💬 社交", cats: ["telegram","twitter","facebook","whatsapp","discord","reddit","line","signal","meta","threads","linkedin","tiktok"] },
  { name: "🎮 游戏", cats: ["steam","category-games","playstation","xbox","nintendo","roblox","riot","gog"] },
  { name: "🛠 科技开发", cats: ["google","github","gitlab","docker","onedrive","microsoft-dev","amazon","cloudflare","adobe","nvidia","oracle","mozilla","notion","dropbox","category-dev"] },
];
function renderGeoPick(i, filter){
  const el = document.getElementById("geoPick" + i);
  if (!el) return;
  const cats = GEO_CATS.length ? GEO_CATS : GEO_FALLBACK;
  const catSet = new Set(cats);
  const f = String(filter || "").trim().toLowerCase();
  const sel = new Set(S.groups[i].geosites || []);
  const box = c => `<label><input type="checkbox" ${sel.has(c) ? "checked" : ""} onchange="geoToggle(${i},'${c}',this.checked)">${esc(c)}</label>`;
  if (f) {
    const list = cats.filter(c => c.includes(f)).slice(0, 400);
    el.innerHTML = list.map(box).join("") || '<span class="dim">没有匹配的分类</span>';
  } else {
    const used = new Set();
    let h = "";
    for (const b of GEO_BUCKETS) {
      const list = b.cats.filter(c => catSet.has(c));
      list.forEach(c => used.add(c));
      if (!list.length) continue;
      const selN = list.filter(c => sel.has(c)).length;
      h += `<details class="geobucket"><summary>${b.name} <span class="dim">${list.length} 个${selN ? ` · 已选 ${selN}` : ""}</span></summary><div>${list.map(box).join("")}</div></details>`;
    }
    const rest = cats.filter(c => !used.has(c));
    h += `<details class="geobucket"><summary>📚 全部其他 <span class="dim">${rest.length} 个（太多时用搜索）</span></summary><div>${rest.slice(0, 600).map(box).join("")}</div></details>`;
    el.innerHTML = h;
  }
  const cnt = document.getElementById("geoCount" + i);
  if (cnt) cnt.textContent = sel.size ? `已选 ${sel.size} 个` : "";
}
function gSub(i, tag, on){
  let arr = S.groups[i].subs || [];
  if (on && !arr.includes(tag)) arr.push(tag);
  if (!on) arr = arr.filter(t=>t!==tag);
  S.groups[i].subs = arr;
}
function gNode(i, v){
  if (!v){ S.groups[i].node = null; return; }
  const [tag, j] = v.split("|");
  const n = (S.nodes[tag]||{}).nodes[Number(j)];
  if (n) S.groups[i].node = { sub: tag, name: n.name, link: n.link };
}
function delGroup(i){ S.groups.splice(i,1); render(); }
function addGroup(){
  const id = Math.random().toString(16).slice(2,10);
  S.groups.push({ id, name: "新策略组", mode: "auto", subs: [], include: [], exclude: ["剩余","到期","过期","官网","流量"], domains: [], geosites: [], suffixes: [], ports: [], node: null });
  render();
}

/* 订阅刷新后，把手动组里已存的节点链接按（订阅,名称）同步为最新 */
function syncGroupNodes(){
  for (const g of S.groups){
    if (g.mode==="manual" && g.node){
      const c = S.nodes[g.node.sub];
      if (c && c.nodes){
        const n = c.nodes.find(x=>x.name===g.node.name);
        if (n) g.node.link = n.link;
      }
    }
  }
}

async function save(){ return api("/api/save", { subs: S.subs, groups: S.groups, settings: { lan_interface: document.getElementById("lanIface").value.trim() } }); }
async function applyAll(){
  msg("保存并应用中…");
  const sv = await save();
  if (!sv.ok){ msg(sv.message||"保存失败", true); return; }
  const r = await api("/api/apply");
  if (r.ok) msg("✓ 已应用：" + (r.reloaded ? "dae 已热重载" : (r.message||"")));
  else msg("✗ " + (r.message||"应用失败") + (r.output ? "\n" + r.output : ""), true);
  const st = await api("/api/state"); S.dae = st.dae; render();
}
async function svc(action){
  msg("执行 " + action + " …");
  await save();
  const r = await api("/api/service", { action });
  msg(r.ok ? "✓ dae " + action + " 完成" : "✗ " + (r.output||"操作失败"), !r.ok);
  const st = await api("/api/state"); S.dae = st.dae; render();
}
async function addSub(){
  const tag = document.getElementById("newSubTag").value.trim();
  const url = document.getElementById("newSubUrl").value.trim();
  if (!tag || !url){ msg("标签和链接都要填", true); return; }
  if (S.subs.some(s=>s.tag===tag)){ msg("标签已存在", true); return; }
  S.subs.push({ tag, url });
  await save();
  msg("拉取订阅中…");
  const r = await api("/api/fetch_sub", { tag, url });
  const st = await api("/api/state"); S.nodes = st.nodes;
  document.getElementById("newSubTag").value = ""; document.getElementById("newSubUrl").value = "";
  msg(r.ok ? `✓ 订阅 ${tag}：${r.count} 个节点，点“保存并应用配置”后生效` : "✗ " + r.message, !r.ok);
  render();
}
async function fetchOne(i){
  const s = S.subs[i];
  msg("拉取 " + s.tag + " …");
  const r = await api("/api/fetch_sub", { tag: s.tag, url: s.url });
  const st = await api("/api/state"); S.nodes = st.nodes; syncGroupNodes();
  msg(r.ok ? `✓ ${s.tag}：${r.count} 个节点` : "✗ " + r.message, !r.ok);
  render();
}
async function delSub(i){
  const tag = S.subs[i].tag;
  S.subs.splice(i,1); delete S.nodes[tag];
  await save(); render();
}
async function refreshSubs(){
  msg("刷新全部订阅中…");
  const r = await api("/api/refresh");
  S.nodes = r.nodes || {}; syncGroupNodes();
  msg(r.ok ? `✓ 共 ${r.total} 个节点` : "✗ 部分订阅失败：" + JSON.stringify(r.errors), !r.ok);
  render();
}
async function loadLogs(){
  const r = await api("/api/logs");
  document.getElementById("logs").textContent = r.logs || "(无日志)";
}

(async function init(){
  const st = await api("/api/state");
  S = st; render();
  try {
    const g = await api("/api/geosite");
    if (g.ok && g.categories && g.categories.length){ GEO_CATS = g.categories; render(); }
  } catch (e) { /* 用内置候选列表兜底 */ }
})();
</script>
</body>
